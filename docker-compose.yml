services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    image: enterprise-agent-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: enterprise-agent-backend:local
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DOCUMENT_PROCESSING_BACKEND: ${DOCUMENT_PROCESSING_BACKEND:-manual}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_NATIVE_DIMENSIONS: ${EMBEDDING_NATIVE_DIMENSIONS:-1536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_API_BASE_URL: ${CHAT_API_BASE_URL:-}
      CHAT_DISABLE_THINKING: ${CHAT_DISABLE_THINKING:-false}
      CHAT_STRUCTURED_OUTPUT_METHOD: ${CHAT_STRUCTURED_OUTPUT_METHOD:-json_schema}
      RETRIEVAL_EMBEDDING_TIMEOUT_SECONDS: ${RETRIEVAL_EMBEDDING_TIMEOUT_SECONDS:-15}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-4o-mini}
      ANSWER_GENERATION_TIMEOUT_SECONDS: ${ANSWER_GENERATION_TIMEOUT_SECONDS:-30}
      DIAGNOSTIC_PLANNING_TIMEOUT_SECONDS: ${DIAGNOSTIC_PLANNING_TIMEOUT_SECONDS:-10}
      AUTH_ISSUER: ${AUTH_ISSUER:-enterprise-agent-platform}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-enterprise-agent-api}
      INDEX_TARGET_TOKENS: ${INDEX_TARGET_TOKENS:-400}
      INDEX_MAX_TOKENS: ${INDEX_MAX_TOKENS:-600}
      INDEX_MAX_CHUNKS: ${INDEX_MAX_CHUNKS:-1000}
      INDEX_EMBED_BATCH_SIZE: ${INDEX_EMBED_BATCH_SIZE:-32}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/data/uploads
      - ./config/auth-public.pem:/app/config/auth-public.pem:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    profiles: ["indexing"]
    image: enterprise-agent-backend:local
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-}
      EMBEDDING_NATIVE_DIMENSIONS: ${EMBEDDING_NATIVE_DIMENSIONS:-1536}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      DOCUMENT_PROCESSING_BACKEND: ${DOCUMENT_PROCESSING_BACKEND:-manual}
      INDEX_EMBEDDING_TIMEOUT_SECONDS: ${INDEX_EMBEDDING_TIMEOUT_SECONDS:-60}
      INDEX_LEASE_SECONDS: ${INDEX_LEASE_SECONDS:-900}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
